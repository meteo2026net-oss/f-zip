name: Flutter CI

on:
  pull_request:
    branches: [main]
    paths:
      - "meteo_weather_flutter_clean/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meteo_weather_flutter_clean
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: bash tool/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release

      - name: Upload Android and Web artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcnc-weather-build-${{ github.run_number }}
          path: |
            meteo_weather_flutter_clean/build/app/outputs/flutter-apk/app-release.apk
            meteo_weather_flutter_clean/build/web/
            meteo_weather_flutter_clean/android/
            !meteo_weather_flutter_clean/android/local.properties
            !meteo_weather_flutter_clean/android/**/build/**
            meteo_weather_flutter_clean/web/
          if-no-files-found: error
          retention-days: 14
